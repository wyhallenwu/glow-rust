[package]
name = "glow"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "A beautiful terminal and web Markdown reader"
license = "MIT"
repository = "https://github.com/wyhallenwu/glow-rust"
keywords = ["markdown", "terminal", "tui", "documentation"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "glow"
path = "src/main.rs"

[dependencies]
ammonia = "4.1"
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = "4.5"
crossterm = "0.29"
dirs = "6.0"
html-escape = "0.2"
ignore = "0.4"
mermaid-svg = "0.7"
notify = "8.2"
percent-encoding = "2.3"
pulldown-cmark = "0.13"
pulldown-latex = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shell-words = "1.1"
syntect = "5.3"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
